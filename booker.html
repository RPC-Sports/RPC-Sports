<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devin Booker | RPC Sports</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #05080d;
    color: white;
}

header {
    height: 72px;
    background: #080c12;
    border-bottom: 1px solid #202936;
    display: flex;
    align-items: center;
    padding: 0 5%;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    font-style: italic;
}

.logo span {
    color: #168cff;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: auto;
}

.back {
    display: inline-block;
    margin: 30px 0;
    color: #168cff;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    background: linear-gradient(135deg, #12345c, #08101b);
    border: 1px solid #263241;
    border-radius: 18px;
    padding: 45px;
}

.sport {
    color: #168cff;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(40px, 8vw, 75px);
    margin: 10px 0;
    font-style: italic;
}

.team {
    color: #9da8b8;
    font-size: 17px;
}

.stats {
    display: flex;
    gap: 40px;
    margin-top: 35px;
    flex-wrap: wrap;
}

.stat strong {
    display: block;
    font-size: 35px;
}

.stat span {
    color: #8491a2;
    font-size: 12px;
}

.video {
    margin-top: 25px;
    height: 350px;
    border: 1px solid #263241;
    border-radius: 14px;
    background: #080d14;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.video h2 {
    color: #168cff;
}

.details {
    margin-top: 25px;
    background: #0b1119;
    border: 1px solid #263241;
    border-radius: 14px;
    padding: 25px;
}

.details h2 {
    margin-bottom: 12px;
}

.details p {
    color: #9da8b8;
    line-height: 1.6;
}

@media (max-width: 600px) {
    .hero {
        padding: 30px 20px;
    }

    .stats {
        gap: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo"><span>RPC</span> SPORTS</div>
</header>

<main class="container">

<a class="back" href="index.html">← Back to RPC Sports</a>

<section class="hero">

<div class="sport">NBA • Featured Performance</div>

<h1>Devin Booker</h1>

<div class="team">Phoenix Suns • Guard</div>

<div class="stats">

<div class="stat">
<strong>44</strong>
<span>PTS</span>
</div>

<div class="stat">
<strong>7</strong>
<span>REB</span>
</div>

<div class="stat">
<strong>8</strong>
<span>AST</span>
</div>

</div>

</section>

<section class="video">
<div>
<h2>▶ PERFORMANCE VIDEO</h2>
<p style="color:#8491a2;margin-top:10px;">
Video will be added here
</p>
</div>
</section>

<section class="details">

<h2>Performance Details</h2>

<p>
Devin Booker put together a standout performance with
44 points, 7 rebounds and 8 assists.
</p>

</section>

</main>

</body>
</html>
